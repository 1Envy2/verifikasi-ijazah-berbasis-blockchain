version: '3.8'

networks:
  besu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24

x-besu-node: &besu-node
  image: hyperledger/besu:latest
  networks:
    - besu_network
  command:
    - --network-id=1337
    - --genesis-file=/networkFiles/output/genesis.json
    - --data-path=/opt/besu/data
    - --rpc-http-enabled=true
    - --rpc-http-api=ETH,NET,QBFT,WEB3
    - --rpc-http-cors-origins=all
    - --host-allowlist=*

services:
  rektorat:
    <<: *besu-node
    container_name: rektorat
    networks:
      besu_network:
        ipv4_address: 172.16.239.11
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/rektorat:/opt/besu/data
      - ./keys/rektorat:/opt/besu/keys
    command:
      - --node-private-key-file=/opt/besu/keys/key
      - --genesis-file=/networkFiles/output/genesis.json
      - --rpc-http-port=8545
      - --p2p-port=30301
    ports:
      - "8545:8545"
      - "30301:30301"

  bak:
    <<: *besu-node
    container_name: bak
    depends_on:
      - rektorat
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/bak:/opt/besu/data
      - ./keys/bak:/opt/besu/keys
    command:
      - --node-private-key-file=/opt/besu/keys/key
      - --genesis-file=/networkFiles/output/genesis.json
      - --rpc-http-port=8546
      - --p2p-port=30302
      - --bootnodes=enode://263dfc6553b550e9e519d7989bd458bf92584bedbded56e20c93f70ae764082a5ddcbe0d8e1b6f2440ee74b220578fba0db63bbda573a941a7db8086425c688b@172.16.239.11:30301
    ports:
      - "8546:8545"
      - "30302:30301"

  fakultas_mipa:
    <<: *besu-node
    container_name: fakultas_mipa
    depends_on:
      - rektorat
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/fakultas_mipa:/opt/besu/data
      - ./keys/fakultas_mipa:/opt/besu/keys
    command:
      - --node-private-key-file=/opt/besu/keys/key
      - --genesis-file=/networkFiles/output/genesis.json
      - --rpc-http-port=8547
      - --p2p-port=30303
      - --bootnodes=enode://263dfc6553b550e9e519d7989bd458bf92584bedbded56e20c93f70ae764082a5ddcbe0d8e1b6f2440ee74b220578fba0db63bbda573a941a7db8086425c688b@172.16.239.11:30301
    ports:
      - "8547:8545"
      - "30303:30301"

  fakultas_pertanian:
    <<: *besu-node
    container_name: fakultas_pertanian
    depends_on:
      - rektorat
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/fakultas_pertanian:/opt/besu/data
      - ./keys/fakultas_pertanian:/opt/besu/keys
    command:
      - --node-private-key-file=/opt/besu/keys/key
      - --genesis-file=/networkFiles/output/genesis.json
      - --rpc-http-port=8548
      - --p2p-port=30304
      - --bootnodes=enode://263dfc6553b550e9e519d7989bd458bf92584bedbded56e20c93f70ae764082a5ddcbe0d8e1b6f2440ee74b220578fba0db63bbda573a941a7db8086425c688b@172.16.239.11:30301
    ports:
      - "8548:8545"
      - "30304:30301"

  upt_tik:
    <<: *besu-node
    container_name: upt_tik
    depends_on:
      - rektorat
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/upt_tik:/opt/besu/data
      - ./keys/upt_tik:/opt/besu/keys
    command:
      - --node-private-key-file=/opt/besu/keys/key
      - --genesis-file=/networkFiles/output/genesis.json
      - --rpc-http-port=8549
      - --p2p-port=30305
      - --bootnodes=enode://263dfc6553b550e9e519d7989bd458bf92584bedbded56e20c93f70ae764082a5ddcbe0d8e1b6f2440ee74b220578fba0db63bbda573a941a7db8086425c688b@172.16.239.11:30301
    ports:
      - "8549:8545"
      - "30305:30301"
