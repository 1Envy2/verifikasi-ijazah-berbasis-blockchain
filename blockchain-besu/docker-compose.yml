version: '3.8'

networks:
  besu_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24

services:
  rektorat:
    image: hyperledger/besu:latest
    container_name: rektorat
    networks:
      besu_network:
        ipv4_address: 172.16.239.11
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/rektorat:/opt/besu/data
      - ./keys/rektorat:/opt/besu/keys
    command:
      - --network-id=1337
      - --genesis-file=/networkFiles/output/genesis.json
      - --data-path=/opt/besu/data
      - --node-private-key-file=/opt/besu/keys/key
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --p2p-port=30301
      - --min-gas-price=0
    ports:
      - "8545:8545"
      - "30301:30301"

  bak:
    image: hyperledger/besu:latest
    container_name: bak
    networks:
      - besu_network
    depends_on:
      - rektorat
    volumes:
      - ./networkFiles:/networkFiles
      - ./data/bak:/opt/besu/data
      - ./keys/bak:/opt/besu/keys
    command:
      - --network-id=1337
      - --genesis-file=/networkFiles/output/genesis.json
      - --data-path=/opt/besu/data
      - --node-private-key-file=/opt/besu/keys/key
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --p2p-port=30301
      - --min-gas-price=0
      - --bootnodes=enode://263dfc6553b550e9e519d7989bd458bf92584bedbded56e20c93f70ae764082a5ddcbe0d8e1b6f2440ee74b220578fba0db63bbda573a941a7db8086425c688b@172.16.239.11:30301
    ports:
      - "8546:8545"
      - "30302:30301"

  fakultas_mipa:
